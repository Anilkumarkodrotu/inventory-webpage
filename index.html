<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaat Corner - Daily Inventory Manager</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Professional Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- SheetJS for Excel Exports -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            display: ['"Plus Jakarta Sans"', 'sans-serif']
          },
          colors: {
            brand: {
              lilac: '#CBB3E8',
              lime: '#D4FF3F',
              coral: '#E34234',
              dark: '#1E142B',
              cardBg: 'rgba(255, 255, 255, 0.92)',
              inputBg: '#F3EAFE'
            }
          },
          boxShadow: {
            'gloss': '0 12px 32px -4px rgba(82, 38, 128, 0.2), inset 0 1px 0 0 rgba(255, 255, 255, 0.9)',
            'lime-glow': '0 0 20px rgba(212, 255, 63, 0.6)',
            'coral-glow': '0 8px 24px rgba(227, 66, 52, 0.4)',
            'inner-soft': 'inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)'
          }
        }
      }
    }
  </script>

  <style>
    /* Viewport Lock & Larger General Font Base */
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #CBB3E8;
      background-image: 
        radial-gradient(at 10% 20%, rgba(212, 255, 63, 0.45) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(227, 66, 52, 0.35) 0px, transparent 50%),
        radial-gradient(at 80% 80%, rgba(255, 255, 255, 0.65) 0px, transparent 50%),
        radial-gradient(at 10% 90%, rgba(147, 51, 234, 0.3) 0px, transparent 50%);
      color: #1E142B;
      font-size: 18px; /* Increased base font size */
    }

    /* Custom Glass Panel Cards */
    .glass-panel {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 12px 32px -4px rgba(82, 38, 128, 0.18), inset 0 1px 1px rgba(255, 255, 255, 1);
    }

    .glass-input {
      background: #F3EAFE;
      border: 2px solid rgba(203, 179, 232, 0.7);
      transition: all 0.2s ease;
    }

    .glass-input:focus {
      background: #FFFFFF;
      border-color: #E34234;
      box-shadow: 0 0 0 4px rgba(227, 66, 52, 0.2);
      outline: none;
    }

    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(203, 179, 232, 0.25);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #E34234;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #b52b1e;
    }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    .animate-float {
      animation: floatOrb 5s ease-in-out infinite;
    }
  </style>
</head>

<body class="font-sans antialiased h-screen flex flex-col p-4 gap-4">

  <!-- TOAST NOTIFICATIONS -->
  <div id="toastContainer" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- MAIN WIREFRAME 3-COLUMN FLEX LAYOUT -->
  <div class="flex-1 flex flex-col lg:flex-row gap-4 overflow-hidden h-full">

    <!-- 1. LEFT SIDEBAR (LOGO & NAV) -->
    <aside class="w-full lg:w-64 glass-panel rounded-3xl p-5 flex lg:flex-col justify-between shrink-0 relative overflow-hidden">
      
      <div class="space-y-6 w-full">
        <!-- WIREFRAME BOX 1: LOGO -->
        <div class="flex items-center gap-3.5 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
          <div class="w-13 h-13 rounded-2xl bg-gradient-to-tr from-[#E34234] via-[#CBB3E8] to-[#D4FF3F] p-0.5 shadow-md flex items-center justify-center shrink-0 animate-float">
            <div class="w-full h-full bg-slate-900 rounded-[14px] flex items-center justify-center">
              <i class="fa-solid fa-store text-2xl text-[#D4FF3F]"></i>
            </div>
          </div>
          <div>
            <h1 class="font-display font-black text-lg text-slate-900 tracking-tight leading-none">ISTHARA</h1>
            <span class="text-xs font-black text-[#E34234] tracking-widest uppercase">Chaat Corner</span>
          </div>
        </div>

        <!-- WIREFRAME BOX 2: HOME NAVIGATION -->
        <nav class="space-y-3">
          <button onclick="switchView('entry')" id="nav-home" class="w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl font-extrabold text-sm bg-[#E34234] text-white shadow-coral-glow transition transform active:scale-95">
            <i class="fa-solid fa-house text-base"></i>
            <span>Home</span>
          </button>

          <button onclick="switchView('history')" id="nav-history" class="w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl font-bold text-sm text-slate-700 hover:bg-white hover:text-slate-900 transition border border-transparent hover:border-slate-200">
            <i class="fa-solid fa-database text-base text-[#E34234]"></i>
            <span>Saved DB Logs</span>
          </button>
        </nav>
      </div>

      <!-- Live Shift Stats Footer -->
      <div class="hidden lg:block pt-4 border-t border-slate-200/80">
        <div class="bg-gradient-to-r from-[#D4FF3F]/40 to-[#CBB3E8]/40 p-3.5 rounded-2xl border border-white flex items-center justify-between">
          <div>
            <span class="text-[11px] font-black text-slate-600 uppercase block">Today's Date</span>
            <span class="text-sm font-black text-slate-900" id="liveDateDisplay">Oct 21, 2026</span>
          </div>
          <span class="w-3 h-3 rounded-full bg-[#E34234] animate-ping"></span>
        </div>
      </div>
    </aside>

    <!-- 2. CENTER WORKING AREA (SEARCH + MAIN FORM + QUICK CATALOG) -->
    <main class="flex-1 flex flex-col gap-4 overflow-hidden min-w-0">
      
      <!-- WIREFRAME BOX 3: TOP SEARCH BAR -->
      <header class="glass-panel p-3 px-5 rounded-3xl flex items-center gap-4 shrink-0">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-5 top-4 text-slate-400 text-base"></i>
          <input type="text" id="globalSearch" oninput="handleSearch()" placeholder="Search items (e.g. White peas, Butter, Pav bhaji masala)..." 
                 class="w-full bg-[#F3EAFE] border-2 border-white rounded-full pl-13 pr-12 py-3 text-sm font-bold text-slate-900 placeholder-slate-500 focus:outline-none focus:bg-white focus:border-[#E34234] transition shadow-inner-soft">
          <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-4 top-3 text-slate-400 hover:text-slate-800 text-sm bg-slate-200 w-6 h-6 rounded-full items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div class="hidden sm:flex items-center gap-2 bg-[#D4FF3F] px-4 py-2 rounded-full text-slate-900 font-extrabold text-xs border border-white shadow-sm">
          <i class="fa-solid fa-bolt text-[#E34234] text-sm"></i>
          <span>Inventory Mode</span>
        </div>
      </header>

      <!-- VIEW 1: ENTRY WORKSPACE -->
      <div id="view-entry" class="flex-1 flex flex-col gap-4 overflow-hidden min-h-0">
        
        <!-- WIREFRAME MAIN CONTENT CARD: ITEM + QTY + PRICE -->
        <div class="glass-panel p-5 lg:p-6 rounded-3xl border-2 border-white shadow-gloss shrink-0 space-y-4">
          <div class="flex items-center justify-between border-b border-slate-200/80 pb-3">
            <h2 class="font-display font-black text-base text-slate-900 flex items-center gap-2.5">
              <span class="w-7 h-7 rounded-xl bg-[#E34234] text-white flex items-center justify-center text-xs">
                <i class="fa-solid fa-plus"></i>
              </span>
              Add Inventory Entry
            </h2>
            <span class="text-xs font-black uppercase tracking-wider text-slate-600 bg-white/90 px-3 py-1 rounded-full border border-slate-200">
              Qty is mandatory
            </span>
          </div>

          <!-- INPUT FORM FIELDS -->
          <form id="entryForm" onsubmit="handleAddToCart(event)" class="space-y-4">
            
            <!-- ITEM SELECT FIELD -->
            <div class="relative">
              <label class="block text-xs font-black uppercase tracking-wide text-slate-700 mb-1.5 flex items-center justify-between">
                <span>Select / Search Item *</span>
                <span id="selectedCategoryBadge" class="hidden text-xs bg-[#CBB3E8] text-slate-900 px-2.5 py-0.5 rounded-full font-extrabold"></span>
              </label>
              
              <div class="relative">
                <input type="text" id="itemSelectInput" onfocus="showItemDropdown()" oninput="filterItemDropdown()" placeholder="Type or click to select item..." autocomplete="off"
                       class="glass-input w-full rounded-2xl px-4 py-3 text-sm font-extrabold text-slate-900 focus:outline-none">
                <i class="fa-solid fa-chevron-down absolute right-4 top-4 text-slate-400 text-xs pointer-events-none"></i>
              </div>

              <!-- DROPDOWN OPTIONS LIST -->
              <div id="itemDropdownList" class="hidden absolute left-0 right-0 top-full mt-1.5 bg-white border-2 border-slate-200 rounded-2xl shadow-2xl max-h-56 overflow-y-auto z-40 p-1.5 space-y-1">
                <!-- Dynamically populated options -->
              </div>
            </div>

            <!-- QTY & PRICE ROW -->
            <div class="grid grid-cols-2 gap-4">
              <!-- QTY (Mandatory) -->
              <div>
                <label class="block text-xs font-black uppercase tracking-wide text-slate-700 mb-1.5">Quantity (Qty) *</label>
                <div class="relative">
                  <input type="number" step="any" min="0.01" id="itemQty" placeholder="Enter quantity" required
                         class="glass-input w-full rounded-2xl px-4 py-3 text-sm font-black text-slate-900 focus:outline-none">
                  <span id="qtyUnitLabel" class="absolute right-4 top-3 text-xs font-black text-slate-400 uppercase">Units</span>
                </div>
              </div>

              <!-- PRICE (Optional or Plain Integers accepted) -->
              <div>
                <label class="block text-xs font-black uppercase tracking-wide text-slate-700 mb-1.5">Price (₹)</label>
                <div class="relative">
                  <span class="absolute left-4 top-3 text-sm font-black text-[#E34234]">₹</span>
                  <input type="number" step="any" min="0.01" id="itemPrice" placeholder="Enter price" required
                         class="glass-input w-full rounded-2xl pl-9 pr-4 py-3 text-sm font-black text-slate-900 focus:outline-none">
                </div>
              </div>
            </div>

            <!-- ADD TO CART BUTTON -->
            <button type="submit" class="w-full py-4 bg-[#D4FF3F] hover:bg-[#c3f028] text-slate-900 font-extrabold text-sm uppercase tracking-wider rounded-2xl shadow-lime-glow hover:shadow-lg transition transform active:scale-98 flex items-center justify-center gap-2.5 border-2 border-white">
              <i class="fa-solid fa-cart-plus text-base text-[#E34234]"></i>
              <span>Add To Cart List</span>
            </button>
          </form>
        </div>

        <!-- CATEGORY QUICK SELECT CATALOG GRID -->
        <div class="glass-panel flex-1 p-4 rounded-3xl overflow-hidden flex flex-col min-h-0">
          
          <div class="flex items-center justify-between pb-2.5 mb-2.5 border-b border-slate-200/80 shrink-0">
            <span class="text-xs font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-layer-group text-[#E34234] text-sm"></i> Pre-loaded Item Catalog
            </span>
            <span id="catalogCountBadge" class="text-xs font-black bg-[#CBB3E8]/60 text-slate-900 px-3 py-0.5 rounded-full">0 Items</span>
          </div>

          <!-- Category Chips -->
          <div class="flex gap-2 overflow-x-auto pb-2.5 shrink-0" id="categoryChips">
            <!-- Dynamic Chips -->
          </div>

          <!-- Catalog Cards Grid -->
          <div class="flex-1 overflow-y-auto pr-1 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-1 min-h-0" id="catalogGrid">
            <!-- Dynamic Food Cards -->
          </div>
        </div>

      </div>

      <!-- VIEW 2: SAVED DATABASE LOGS -->
      <div id="view-history" class="hidden flex-1 glass-panel p-5 rounded-3xl overflow-y-auto space-y-4">
        <h2 class="font-display font-black text-base text-slate-900 flex items-center gap-2">
          <i class="fa-solid fa-database text-[#E34234]"></i> Saved Database Logs
        </h2>
        <div id="historyLogsList" class="space-y-3">
          <!-- Rendered Saved Logs -->
        </div>
      </div>

    </main>

    <!-- 3. RIGHT SIDE PANEL (CART & DAILY ENTRY SHEET) -->
    <aside class="w-full lg:w-88 xl:w-96 glass-panel rounded-3xl p-5 flex flex-col overflow-hidden shrink-0 border-2 border-white shadow-gloss">
      
      <!-- CART HEADER -->
      <div class="pb-3 border-b border-slate-200 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-[#E34234] text-white flex items-center justify-center font-bold text-base shadow-coral-glow">
            <i class="fa-solid fa-receipt"></i>
          </div>
          <div>
            <h2 class="font-display font-black text-base text-slate-900">Cart Sheet</h2>
            <p class="text-xs font-extrabold text-slate-500" id="cartBadgeText">0 items added</p>
          </div>
        </div>

        <button onclick="clearCart()" class="text-xs font-bold text-red-600 hover:bg-red-50 px-3 py-1.5 rounded-xl transition border border-transparent hover:border-red-200">
          Clear All
        </button>
      </div>

      <!-- NUMBERED CART LIST -->
      <div class="flex-1 overflow-y-auto py-3 space-y-2.5 pr-1 min-h-0" id="cartList">
        <!-- Numbered Cart Items 1., 2., 3... -->
      </div>

      <!-- EMPTY CART STATE -->
      <div id="cartEmptyState" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-16 h-16 rounded-full bg-[#D4FF3F] text-[#E34234] flex items-center justify-center text-3xl mb-3 shadow-lime-glow animate-float">
          <i class="fa-solid fa-basket-shopping"></i>
        </div>
        <p class="text-sm font-black text-slate-800">Cart is empty</p>
        <p class="text-xs font-semibold text-slate-500 mt-1 max-w-[200px]">Select items from center panel to add to daily inventory</p>
      </div>

      <!-- SUMMARY & SAVE TO DATABASE PANEL -->
      <div class="pt-3 border-t border-slate-200 space-y-3 shrink-0 bg-white/60 p-4 rounded-2xl mt-auto">
        
        <!-- WIREFRAME SUMMARY: TOTAL ITEMS & TOTAL PRICE -->
        <div class="space-y-2">
          <div class="flex items-center justify-between text-xs">
            <span class="font-black text-slate-600 uppercase tracking-wide">Total Items:</span>
            <span class="font-black text-sm text-slate-900 bg-white px-3 py-0.5 rounded-full border border-slate-200" id="summaryTotalCount">0</span>
          </div>

          <div class="flex items-center justify-between text-sm pt-2 border-t border-slate-200">
            <span class="font-black text-slate-900 uppercase tracking-wide">Total Price:</span>
            <span class="font-display font-black text-2xl text-[#E34234]" id="summaryTotalPrice">₹0</span>
          </div>
        </div>

        <!-- WIREFRAME BUTTON: SAVE TO DATA BASE -->
        <button onclick="saveToDatabase()" class="w-full py-4 bg-[#E34234] hover:bg-[#cc3326] text-white font-black text-sm uppercase tracking-wider rounded-2xl shadow-coral-glow transition transform active:scale-98 flex items-center justify-center gap-2.5 border border-white">
          <i class="fa-solid fa-floppy-disk text-base"></i>
          <span>Save to Data Base</span>
        </button>

      </div>

    </aside>

  </div>

  <!-- INVENTORY LOGIC ENGINE -->
  <script>
    // PRE-LOADED ITEM DATABASE
    const ITEM_DATABASE = [
      // Groceries
      { id: 'g1', name: 'White peas', category: 'Groceries', unit: 'Kg' },

      // Dairy
      { id: 'd1', name: 'Curd', category: 'Dairy', unit: 'Kg' },
      { id: 'd2', name: 'Butter', category: 'Dairy', unit: 'Packs' },

      { id: 'd4', name: 'Paneer', category: 'Dairy', unit: 'Kg' },

      // Snacks
      { id: 's1', name: 'Murmura', category: 'Snacks', unit: 'Kg' },
      { id: 's2', name: 'Panipuri', category: 'Snacks', unit: 'Packets' },
      { id: 's3', name: 'Samosa', category: 'Snacks', unit: 'Pcs' },
      { id: 's4', name: 'Kachori', category: 'Snacks', unit: 'Pcs' },

      { id: 'v1', name: 'Cauliflower', category: 'Vegetables', unit: 'Kg' },
      { id: 'v2', name: 'Carrots', category: 'Vegetables', unit: 'Kg' },

      { id: 'v10', name: 'Ginger', category: 'Vegetables', unit: 'Kg' },
      { id: 'v11', name: 'Garlic', category: 'Vegetables', unit: 'Kg' },
      { id: 'v12', name: 'Lemons', category: 'Vegetables', unit: 'Pcs' },
      { id: 'v13', name: 'Mirchi', category: 'Vegetables', unit: 'Kg' },
      { id: 'v14', name: 'Capsicum', category: 'Vegetables', unit: 'Kg' },

      // Packaging
      { id: 'p1', name: 'Tissues', category: 'Packaging', unit: 'Packs' },
      { id: 'p2', name: 'Paper rolls', category: 'Packaging', unit: 'Rolls' },
      { id: 'p3', name: 'Garbage bags', category: 'Packaging', unit: 'Packs' },
      { id: 'p4', name: 'Wooden spoons', category: 'Packaging', unit: 'Packs' },

      // Cleaning
      { id: 'c1', name: 'Floor cleaner', category: 'Cleaning', unit: 'Bottles' },
      { id: 'c2', name: 'HIT', category: 'Cleaning', unit: 'Cans' },
      { id: 'c3', name: 'Vim soaps', category: 'Cleaning', unit: 'Bars' },
      { id: 'c4', name: 'Surf', category: 'Cleaning', unit: 'Packets' },
      { id: 'c5', name: 'Handwash', category: 'Cleaning', unit: 'Bottles' }
    ];

    // APPLICATION STATE
    let cart = [];
    let selectedItemObj = null;
    let selectedCategoryFilter = 'All';

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      document.getElementById('liveDateDisplay').innerText = today;

      renderItemDropdownOptions(ITEM_DATABASE);
      renderCategoryChips();
      renderCatalogGrid();
      loadDraftCart();

      // Close dropdown on outside click
      document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('itemDropdownList');
        const input = document.getElementById('itemSelectInput');
        if (!dropdown.contains(e.target) && e.target !== input) {
          dropdown.classList.add('hidden');
        }
      });
    });

    // RENDER DROPDOWN OPTIONS
    function renderItemDropdownOptions(items) {
      const list = document.getElementById('itemDropdownList');
      list.innerHTML = '';

      if (items.length === 0) {
        list.innerHTML = `<div class="p-3 text-xs text-slate-400 text-center font-bold">No matching item found</div>`;
        return;
      }

      items.forEach(item => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = "w-full text-left px-3.5 py-2.5 text-xs font-bold text-slate-800 hover:bg-[#D4FF3F] hover:text-slate-900 rounded-xl flex items-center justify-between transition";
        btn.onclick = () => selectItemFromDropdown(item);
        btn.innerHTML = `
          <span>${escapeHtml(item.name)}</span>
          <span class="text-[10px] uppercase font-black px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${item.category}</span>
        `;
        list.appendChild(btn);
      });
    }

    function showItemDropdown() {
      document.getElementById('itemDropdownList').classList.remove('hidden');
    }

    function filterItemDropdown() {
      const val = document.getElementById('itemSelectInput').value.toLowerCase().trim();
      showItemDropdown();
      const filtered = ITEM_DATABASE.filter(i => i.name.toLowerCase().includes(val) || i.category.toLowerCase().includes(val));
      renderItemDropdownOptions(filtered);
    }

    function selectItemFromDropdown(item) {
      selectedItemObj = item;
      document.getElementById('itemSelectInput').value = item.name;
      document.getElementById('qtyUnitLabel').innerText = item.unit;
      
      const badge = document.getElementById('selectedCategoryBadge');
      badge.innerText = item.category;
      badge.classList.remove('hidden');

      document.getElementById('itemDropdownList').classList.add('hidden');
      document.getElementById('itemQty').focus();
    }

    // RENDER CATEGORY CHIPS
    function renderCategoryChips() {
      const categories = ['All', 'Groceries', 'Masalas', 'Dairy', 'Snacks', 'Vegetables', 'Packaging', 'Cleaning'];
      const container = document.getElementById('categoryChips');
      container.innerHTML = '';

      categories.forEach(cat => {
        const btn = document.createElement('button');
        btn.type = 'button';
        const isActive = selectedCategoryFilter === cat;
        btn.className = `px-3.5 py-1.5 rounded-full text-xs font-black whitespace-nowrap transition ${
          isActive 
            ? 'bg-[#E34234] text-white shadow-coral-glow' 
            : 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200'
        }`;
        btn.onclick = () => {
          selectedCategoryFilter = cat;
          renderCategoryChips();
          renderCatalogGrid();
        };
        btn.innerText = cat;
        container.appendChild(btn);
      });
    }

    // RENDER CATALOG GRID
    function renderCatalogGrid() {
      const grid = document.getElementById('catalogGrid');
      const searchVal = document.getElementById('globalSearch').value.toLowerCase().trim();
      grid.innerHTML = '';

      const filtered = ITEM_DATABASE.filter(item => {
        const matchesCategory = selectedCategoryFilter === 'All' || item.category === selectedCategoryFilter;
        const matchesSearch = item.name.toLowerCase().includes(searchVal);
        return matchesCategory && matchesSearch;
      });

      document.getElementById('catalogCountBadge').innerText = `${filtered.length} Items`;

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = "bg-white hover:bg-slate-50 border border-slate-200 hover:border-[#E34234] p-3 rounded-2xl cursor-pointer transition shadow-sm hover:shadow-md flex flex-col justify-between group";
        card.onclick = () => selectItemFromDropdown(item);

        card.innerHTML = `
          <div class="flex items-start justify-between gap-1">
            <span class="text-xs font-black text-slate-900 leading-tight group-hover:text-[#E34234] transition">${escapeHtml(item.name)}</span>
            <span class="text-[9px] font-black uppercase px-1.5 py-0.5 rounded bg-slate-100 text-slate-500 shrink-0">${item.unit}</span>
          </div>
          <div class="mt-2.5 flex items-center justify-between text-[11px] font-bold text-slate-400">
            <span>${item.category}</span>
            <i class="fa-solid fa-arrow-right-long text-[#E34234] opacity-0 group-hover:opacity-100 transition"></i>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // SEARCH INPUT HANDLER
    function handleSearch() {
      const val = document.getElementById('globalSearch').value;
      document.getElementById('clearSearchBtn').classList.toggle('hidden', val.length === 0);
      renderCatalogGrid();
    }

    function clearSearch() {
      document.getElementById('globalSearch').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderCatalogGrid();
    }

    // ADD TO CART HANDLER (NO PRICE VALIDATION)
    function handleAddToCart(e) {
      e.preventDefault();
      const inputName = document.getElementById('itemSelectInput').value.trim();
      const qtyVal = document.getElementById('itemQty').value;
      const priceVal = document.getElementById('itemPrice').value;

      const qty = parseFloat(qtyVal);
      // Price can be plain integer, 0 or empty
      const price = priceVal !== '' && !isNaN(priceVal) ? parseFloat(priceVal) : 0;

      // MANDATORY CHECK: ITEM NAME & QTY
      if (!inputName) {
        showToast('Please select or enter an item name!', 'error');
        return;
      }
      if (isNaN(qty) || qty <= 0) {
        showToast('Quantity (Qty) is mandatory and must be greater than 0!', 'error');
        return;
      }
      if (isNaN(price) || price <= 0) {
        showToast('Price (Rs) is mandatory and must be greater than 0!', 'error');
        return;
      }
      

      const unit = selectedItemObj ? selectedItemObj.unit : 'Units';

      // Check existing item in cart
      const existingIdx = cart.findIndex(c => c.name.toLowerCase() === inputName.toLowerCase());

      if (existingIdx > -1) {
        cart[existingIdx].qty += qty;
        if (priceVal !== '') cart[existingIdx].price = price; // update price if provided
        showToast(`Updated quantity for ${inputName}`, 'success');
      } else {
        cart.push({
          id: 'cart-' + Date.now(),
          name: inputName,
          qty: qty,
          unit: unit,
          price: price
        });
        showToast(`Added ${inputName} to Cart`, 'success');
      }

      // Reset Form
      document.getElementById('entryForm').reset();
      selectedItemObj = null;
      document.getElementById('selectedCategoryBadge').classList.add('hidden');
      document.getElementById('qtyUnitLabel').innerText = 'Units';

      saveDraftCart();
      renderCart();
    }

    // RENDER CART LIST
    function renderCart() {
      const cartList = document.getElementById('cartList');
      const emptyState = document.getElementById('cartEmptyState');

      cartList.innerHTML = '';

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        cartList.classList.add('hidden');
      } else {
        emptyState.classList.add('hidden');
        cartList.classList.remove('hidden');
      }

      let grandTotal = 0;

      cart.forEach((item, index) => {
        const itemTotal = item.qty * item.price;
        grandTotal += itemTotal;

        const row = document.createElement('div');
        row.className = "bg-white p-3 rounded-2xl border border-slate-200 shadow-sm space-y-2 relative group";

        row.innerHTML = `
          <div class="flex items-center justify-between gap-1">
            <div class="flex items-center gap-2">
              <span class="w-6 h-6 rounded-lg bg-[#CBB3E8]/50 font-black text-xs text-slate-900 flex items-center justify-center">
                ${index + 1}.
              </span>
              <span class="text-xs font-black text-slate-900 leading-tight">${escapeHtml(item.name)}</span>
            </div>

            <button onclick="removeFromCart(${index})" class="text-slate-300 hover:text-red-600 text-sm transition p-1">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>

          <div class="flex items-center justify-between text-xs pt-1.5 border-t border-slate-100">
            <span class="font-extrabold text-slate-600">
              ${item.qty} ${item.unit} ${item.price > 0 ? `× ₹${item.price}` : ''}
            </span>
            <span class="font-black text-[#E34234]">${item.price > 0 ? `₹${itemTotal}` : '—'}</span>
          </div>
        `;

        cartList.appendChild(row);
      });

      document.getElementById('cartBadgeText').innerText = `${cart.length} item(s) in cart`;
      document.getElementById('summaryTotalCount').innerText = cart.length;
      document.getElementById('summaryTotalPrice').innerText = `₹${grandTotal}`;
    }

    function removeFromCart(index) {
      const removed = cart[index].name;
      cart.splice(index, 1);
      saveDraftCart();
      renderCart();
      showToast(`Removed ${removed}`, 'info');
    }

    function clearCart() {
      if (cart.length === 0) return;
      if (confirm("Are you sure you want to clear all cart items?")) {
        cart = [];
        saveDraftCart();
        renderCart();
        showToast('Cart cleared', 'info');
      }
    }

    // PERSISTENCE LOCALSTORAGE
    function saveDraftCart() {
      localStorage.setItem('chaat_cart_draft', JSON.stringify(cart));
    }

    function loadDraftCart() {
      const saved = localStorage.getItem('chaat_cart_draft');
      if (saved) {
        try {
          cart = JSON.parse(saved);
          renderCart();
        } catch(e) { cart = []; }
      }
    }

    // SAVE TO DATABASE & EXPORT EXCEL
    function saveToDatabase() {
      // MANDATORY RULE: AT LEAST 1 ITEM
      if (cart.length === 0) {
        showToast('At least 1 item is required to save inventory!', 'error');
        return;
      }

      const todayStr = new Date().toISOString().split('T')[0];
      const grandTotalVal = cart.reduce((s, i) => s + (i.qty * i.price), 0);

      // Save to LocalStorage Database
      const history = JSON.parse(localStorage.getItem('chaat_db_records') || '[]');
      const newRecord = {
        id: 'DB-' + Date.now(),
        date: todayStr,
        timestamp: new Date().toLocaleTimeString(),
        items: [...cart],
        totalAmount: grandTotalVal
      };

      history.unshift(newRecord);
      localStorage.setItem('chaat_db_records', JSON.stringify(history));

      // EXPORT EXCEL VIA SHEETJS
      exportExcelSheet(todayStr, grandTotalVal);

      showToast('Saved to Database & Excel Exported!', 'success');
      renderHistoryLogs();
    }

    function exportExcelSheet(dateStr, totalVal) {
      const excelData = [
        ["ISTHARA CHAAT CORNER - DAILY INVENTORY LOG"],
        ["Date:", dateStr],
        [],
        ["S.No", "Item Name", "Quantity", "Unit", "Price per Unit (₹)", "Subtotal (₹)"]
      ];

      cart.forEach((item, idx) => {
        excelData.push([
          idx + 1,
          item.name,
          item.qty,
          item.unit,
          item.price || 0,
          item.qty * item.price
        ]);
      });

      excelData.push([]);
      excelData.push(["", "", "", "", "Total Amount:", totalVal]);

      const ws = XLSX.utils.aoa_to_sheet(excelData);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Inventory Log");

      ws['!cols'] = [{wch: 6}, {wch: 28}, {wch: 12}, {wch: 10}, {wch: 18}, {wch: 18}];

      XLSX.writeFile(wb, `Chaat_Inventory_${dateStr}.xlsx`);
    }

    // VIEW SWITCHER
    function switchView(view) {
      document.getElementById('view-entry').classList.toggle('hidden', view !== 'entry');
      document.getElementById('view-history').classList.toggle('hidden', view !== 'history');

      document.getElementById('nav-home').className = view === 'entry' 
        ? "w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl font-extrabold text-sm bg-[#E34234] text-white shadow-coral-glow transition" 
        : "w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl font-bold text-sm text-slate-700 hover:bg-white transition";

      document.getElementById('nav-history').className = view === 'history' 
        ? "w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl font-extrabold text-sm bg-[#E34234] text-white shadow-coral-glow transition" 
        : "w-full flex items-center gap-4 px-5 py-3.5 rounded-2xl font-bold text-sm text-slate-700 hover:bg-white transition";

      if (view === 'history') renderHistoryLogs();
    }

    function renderHistoryLogs() {
      const container = document.getElementById('historyLogsList');
      const history = JSON.parse(localStorage.getItem('chaat_db_records') || '[]');

      if (history.length === 0) {
        container.innerHTML = `<p class="text-sm text-slate-500 font-extrabold py-8 text-center">No saved database records found yet.</p>`;
        return;
      }

      container.innerHTML = '';
      history.forEach(log => {
        const itemNames = log.items.map(i => `${i.name} (${i.qty} ${i.unit})`).join(', ');
        const card = document.createElement('div');
        card.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2";
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="font-black text-sm text-slate-900">${log.date} (${log.timestamp})</span>
            <span class="font-black text-sm text-[#E34234]">Total: ₹${log.totalAmount}</span>
          </div>
          <p class="text-xs text-slate-600 line-clamp-2 font-bold">${itemNames}</p>
        `;
        container.appendChild(card);
      });
    }

    // TOAST NOTIFICATIONS
    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      
      const bgColor = type === 'error' ? 'bg-[#E34234] text-white' : (type === 'success' ? 'bg-[#D4FF3F] text-slate-900 border border-white' : 'bg-slate-900 text-white');
      
      toast.className = `px-5 py-3 rounded-2xl text-xs font-black shadow-xl flex items-center gap-2.5 pointer-events-auto transition transform translate-y-2 ${bgColor}`;
      toast.innerHTML = `
        <i class="fa-solid ${type === 'error' ? 'fa-triangle-exclamation text-base' : 'fa-circle-check text-base'}"></i>
        <span>${escapeHtml(msg)}</span>
      `;

      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(-10px)';
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
